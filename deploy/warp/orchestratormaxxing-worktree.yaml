---
name: "cmaxxing: task worktree"
command: "task-workspace resolve --mode worktree --project {{project}} --branch task/{{branch}}"
tags: ["orchestratormaxxing", "worktree", "wt"]
description: "Create (or reuse) an isolated worktrunk worktree for a task under ~/dev/.worktrees and print its path. Uses `wt` (worktrunk) through bin/task-workspace."
arguments:
  - name: project
    description: "Absolute project path (the dev folder)"
    default_value: "$PWD"
  - name: branch
    description: "Task slug; the branch becomes task/<slug>"
    default_value: "smoke"
source_url: "https://github.com/ricalanis/orchestratormaxxing"
author: "orchestratormaxxing"
shells: [bash, zsh]
