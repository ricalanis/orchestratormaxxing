name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'ricalanis/orchestratormaxxing'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    timeout-minutes: 40
    env:
      ORCHESTRATORMAXXING_SKIP_EXTERNAL_SKILLS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # deployed-host-state scans git history for retired tools; a shallow clone reads as 'cannot measure'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - name: Configure git
        run: |
          git config --global user.email "verify@example.com"
          git config --global user.name "verify"
      - name: Run harness-verify
        run: |
          # capture the exit code without letting the shell's -e kill the step:
          # 1 = errors (fail below) · 2 = inconclusive (report, don't fail)
          rc=0
          bin/harness-verify --json > hv.json 2> hv.err || rc=$?
          echo "rc=$rc" >> "$GITHUB_ENV"
          echo "rc=$rc"
      - name: Print summary
        run: |
          python3 - <<'EOF'
          import json
          with open("hv.json") as f:
              data = json.load(f)
          print("errors:", data.get("errors", 0))
          print("warnings:", data.get("warnings", 0))
          print("inconclusive:", data.get("inconclusive", 0))
          print("skipped:", data.get("skipped", 0))
          EOF
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hv-diagnostics-${{ matrix.os }}
          path: |
            hv.json
            hv.err
          if-no-files-found: ignore
      - name: Enforce result policy
        run: |
          python3 .github/scripts/verify-result.py hv.json "${rc:?verifier status missing}"
      - name: Report inconclusive
        if: env.rc == '2'
        run: |
          echo "harness-verify reported inconclusive results; not failing. See hv-diagnostics-${{ matrix.os }} artifact."
