# orchestratormaxxing tmux defaults for human-driven Claude/Codex TUI sessions.
# Wheel-up must reach whichever layer can actually scroll. A TUI that enables
# mouse reporting may own its own transcript and alternate screen, where tmux
# keeps zero history. Linux c/g launchers deliberately choose normal-screen
# output so selections span durable tmux history; other mouse-aware TUIs still
# receive their own wheel events. Everything else enters tmux copy-mode.
set-option -g mouse on
set-option -g history-limit 100000

# Keep tmux's copy buffer synchronized to Warp through OSC 52. `external` is
# intentionally write-only: tmux may update the outer clipboard, but programs
# inside a pane may not inject clipboard contents into tmux. The explicit
# clients work directly and through SSH as long as tmux detects the terminal's
# standard clipboard capability.
set-option -s set-clipboard external

# Propagate the current tmux window name to the containing terminal. The c/g
# launchers disable Warp's automatic title so lifecycle hooks own this value.
set-option -g set-titles on
set-option -g set-titles-string '#W'

# Warp's CLI-agent mailbox protocol is OSC 777. Hooks write a DCS-wrapped
# frame to the exact c/g pane TTY so it survives tmux. `on` permits only
# explicit passthrough frames; never use the broader `all` mode.
set-option -g allow-passthrough on

bind-key -T root WheelUpPane if-shell -F -t = '#{mouse_any_flag}' 'send-keys -M' 'copy-mode -e; send-keys -X -N 5 scroll-up'
bind-key -T copy-mode WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down
